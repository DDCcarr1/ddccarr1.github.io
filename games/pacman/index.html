<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>DDCcarr1 | Pacman</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 0;
            margin: 0;
            overflow-x: hidden;
        }

        #navbar-container {
            flex-shrink: 0;
        }

        #footer-container {
            flex-shrink: 0;
            margin-top: auto;
        }

        .container {
            text-align: center;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex: 1;
            padding: 10px;
            width: 100%;
        }

        h1 {
            font-size: 2em;
            margin-bottom: 15px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        .info-bar {
            display: flex;
            justify-content: space-around;
            margin-bottom: 15px;
            gap: 10px;
            flex-wrap: wrap;
        }

        .info-item {
            background: rgba(255, 255, 255, 0.2);
            padding: 8px 15px;
            border-radius: 8px;
            backdrop-filter: blur(10px);
            font-size: 0.9em;
        }

        #gameCanvas {
            background: #000;
            border: 3px solid white;
            border-radius: 8px;
            display: block;
            margin: 15px auto;
            image-rendering: pixelated;
            max-width: 95vw;
            height: auto;
            touch-action: none;
        }

        .controls {
            margin-top: 15px;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
        }

        button {
            background: white;
            color: #667eea;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 0.9em;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            touch-action: manipulation;
        }

        button:active {
            transform: scale(0.95);
        }

        button:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .message {
            font-size: 1.3em;
            margin-top: 15px;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        .back-link {
            display: inline-block;
            color: white;
            text-decoration: none;
            margin-bottom: 10px;
            opacity: 0.8;
            transition: opacity 0.3s ease;
            font-size: 1em;
        }

        .back-link:hover {
            opacity: 1;
        }

        .instructions {
            font-size: 0.85em;
            opacity: 0.9;
            margin-top: 10px;
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 1.6em;
            }

            .info-item {
                font-size: 0.8em;
                padding: 6px 12px;
            }

            button {
                padding: 8px 16px;
                font-size: 0.85em;
            }
        }

        @media (max-width: 480px) {
            h1 {
                font-size: 1.3em;
            }

            button {
                padding: 6px 12px;
                font-size: 0.75em;
            }

            #gameCanvas {
                max-width: 90vw;
            }
        }
    </style>
</head>
<body>
    <div id="navbar-container"></div>
    <div class="container">
        <a href="/games" class="back-link">← Back to Games</a>
        <h1>👾 Pacman</h1>
        
        <div class="info-bar">
            <div class="info-item">Score: <span id="score">0</span></div>
            <div class="info-item">Lives: <span id="lives">3</span></div>
            <div class="info-item">Level: <span id="level">1</span></div>
        </div>

        <canvas id="gameCanvas" width="400" height="400"></canvas>

        <div class="controls">
            <button onclick="newGame()">New Game</button>
            <button onclick="togglePause()">Pause</button>
        </div>

        <div class="message" id="message"></div>
        <p class="instructions">🎮 Use arrow keys or swipe to move | Eat all pellets to advance</p>
    </div>
    <div id="footer-container"></div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        let gridSize = 20;
        let tileCount = canvas.width / gridSize;
        let pacman = {x: 1, y: 1, dir: {x: 1, y: 0}};
        let ghosts = [
            {x: 8, y: 8, color: '#ff0000'},
            {x: 9, y: 8, color: '#ffb8ff'},
            {x: 8, y: 9, color: '#00ffff'},
            {x: 9, y: 9, color: '#ffb847'}
        ];
        let pellets = [];
        let score = 0;
        let lives = 3;
        let level = 1;
        let gameOver = false;
        let gameLost = false;
        let paused = false;

        function initPellets() {
            pellets = [];
            for (let i = 0; i < tileCount; i++) {
                for (let j = 0; j < tileCount; j++) {
                    if (!((i === pacman.x && j === pacman.y) || ghosts.some(g => g.x === i && g.y === j))) {
                        if (Math.random() > 0.15) pellets.push({x: i, y: j});
                    }
                }
            }
        }

        function newGame() {
            pacman = {x: 1, y: 1, dir: {x: 1, y: 0}};
            ghosts = [
                {x: 8, y: 8, color: '#ff0000'},
                {x: 9, y: 8, color: '#ffb8ff'},
                {x: 8, y: 9, color: '#00ffff'},
                {x: 9, y: 9, color: '#ffb847'}
            ];
            score = 0;
            lives = 3;
            level = 1;
            gameOver = false;
            gameLost = false;
            paused = false;
            document.getElementById('message').textContent = '';
            document.getElementById('score').textContent = score;
            document.getElementById('lives').textContent = lives;
            document.getElementById('level').textContent = level;
            initPellets();
            gameLoop();
        }

        function togglePause() {
            if (!gameOver && !gameLost) {
                paused = !paused;
                if (!paused) gameLoop();
            }
        }

        function update() {
            if (paused || gameOver || gameLost) return;

            pacman.x += pacman.dir.x;
            pacman.y += pacman.dir.y;

            if (pacman.x < 0) pacman.x = tileCount - 1;
            if (pacman.x >= tileCount) pacman.x = 0;
            if (pacman.y < 0) pacman.y = tileCount - 1;
            if (pacman.y >= tileCount) pacman.y = 0;

            for (let pellet of pellets) {
                if (pellet.x === pacman.x && pellet.y === pacman.y) {
                    score += 10;
                    pellets = pellets.filter(p => !(p.x === pellet.x && p.y === pellet.y));
                }
            }

            if (pellets.length === 0) {
                level++;
                document.getElementById('level').textContent = level;
                score += 50;
                initPellets();
            }

            for (let ghost of ghosts) {
                // Simple AI: chase Pacman with some randomness
                let dx = pacman.x - ghost.x;
                let dy = pacman.y - ghost.y;
                
                // 80% of the time, move toward Pacman; 20% random
                if (Math.random() < 0.8) {
                    let dirs = [];
                    if (dx > 0) dirs.push({x: 1, y: 0});
                    if (dx < 0) dirs.push({x: -1, y: 0});
                    if (dy > 0) dirs.push({x: 0, y: 1});
                    if (dy < 0) dirs.push({x: 0, y: -1});
                    if (dirs.length > 0) {
                        let dir = dirs[Math.floor(Math.random() * dirs.length)];
                        ghost.x += dir.x;
                        ghost.y += dir.y;
                    }
                } else {
                    let dirs = [{x: 1, y: 0}, {x: -1, y: 0}, {x: 0, y: 1}, {x: 0, y: -1}];
                    let dir = dirs[Math.floor(Math.random() * dirs.length)];
                    ghost.x += dir.x;
                    ghost.y += dir.y;
                }
                
                if (ghost.x < 0) ghost.x = tileCount - 1;
                if (ghost.x >= tileCount) ghost.x = 0;
                if (ghost.y < 0) ghost.y = tileCount - 1;
                if (ghost.y >= tileCount) ghost.y = 0;

                if (ghost.x === pacman.x && ghost.y === pacman.y) {
                    lives--;
                    document.getElementById('lives').textContent = lives;
                    if (lives <= 0) {
                        gameLost = true;
                        document.getElementById('message').textContent = '💥 Game Over! Final Score: ' + score;
                    } else {
                        pacman = {x: 1, y: 1, dir: {x: 1, y: 0}};
                    }
                }
            }

            document.getElementById('score').textContent = score;
        }

        function draw() {
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = '#ffff00';
            ctx.beginPath();
            ctx.arc(pacman.x * gridSize + gridSize / 2, pacman.y * gridSize + gridSize / 2, gridSize / 2 - 2, 0, Math.PI * 2);
            ctx.fill();

            for (let ghost of ghosts) {
                ctx.fillStyle = ghost.color;
                ctx.fillRect(ghost.x * gridSize + 2, ghost.y * gridSize + 2, gridSize - 4, gridSize - 4);
            }

            ctx.fillStyle = '#ffffff';
            for (let pellet of pellets) {
                ctx.fillRect(pellet.x * gridSize + gridSize / 2 - 2, pellet.y * gridSize + gridSize / 2 - 2, 4, 4);
            }

            if (paused) {
                ctx.fillStyle = 'rgba(0, 0, 0, 0.5)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = 'white';
                ctx.font = '30px Arial';
                ctx.textAlign = 'center';
                ctx.fillText('PAUSED', canvas.width / 2, canvas.height / 2);
            }
        }

        function gameLoop() {
            if (!paused && !gameOver && !gameLost) {
                update();
                draw();
                setTimeout(gameLoop, 200);
            } else {
                draw();
            }
        }

        let touchStartX = 0, touchStartY = 0;
        canvas.addEventListener('touchstart', (e) => {
            touchStartX = e.touches[0].clientX;
            touchStartY = e.touches[0].clientY;
        });

        canvas.addEventListener('touchmove', (e) => {
            e.preventDefault();
            const touchEndX = e.touches[0].clientX;
            const touchEndY = e.touches[0].clientY;
            const diffX = touchEndX - touchStartX;
            const diffY = touchEndY - touchStartY;

            if (Math.abs(diffX) > Math.abs(diffY)) {
                if (diffX > 20) pacman.dir = {x: 1, y: 0};
                if (diffX < -20) pacman.dir = {x: -1, y: 0};
            } else {
                if (diffY > 20) pacman.dir = {x: 0, y: 1};
                if (diffY < -20) pacman.dir = {x: 0, y: -1};
            }
        }, {passive: false});

        document.addEventListener('keydown', (e) => {
            if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.key)) {
                e.preventDefault();
                if (e.key === 'ArrowUp') pacman.dir = {x: 0, y: -1};
                if (e.key === 'ArrowDown') pacman.dir = {x: 0, y: 1};
                if (e.key === 'ArrowLeft') pacman.dir = {x: -1, y: 0};
                if (e.key === 'ArrowRight') pacman.dir = {x: 1, y: 0};
            }
        });

        newGame();

        fetch('/partials/navbar.html').then(r => r.text()).then(html => {
            document.getElementById('navbar-container').innerHTML = html;
        });
        fetch('/partials/footer.html').then(r => r.text()).then(html => {
            document.getElementById('footer-container').innerHTML = html;
        });
    </script>
</body>
</html>
