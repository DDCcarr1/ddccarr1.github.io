<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DDCcarr1 | Tic Tac Toe</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 0;
            margin: 0;
        }

        #navbar-container {
            flex-shrink: 0;
        }

        #footer-container {
            flex-shrink: 0;
            margin-top: auto;
        }

        .container {
            text-align: center;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex: 1;
        }

        h1 {
            font-size: 2.5em;
            margin-bottom: 30px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        .game-board {
            background: white;
            border-radius: 10px;
            padding: 10px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            width: 320px;
            margin: 0 auto 30px;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }

        .cell {
            width: 100%;
            aspect-ratio: 1;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 8px;
            font-size: 2em;
            font-weight: bold;
            cursor: pointer;
            color: white;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .cell:hover:not(:disabled) {
            transform: scale(1.05);
            opacity: 0.9;
        }

        .cell:disabled {
            cursor: not-allowed;
        }

        .status {
            font-size: 1.3em;
            margin-bottom: 20px;
            min-height: 30px;
        }

        .status.win {
            color: #4ade80;
            font-weight: bold;
        }

        .status.draw {
            color: #fbbf24;
            font-weight: bold;
        }

        .status.playing {
            opacity: 0.8;
        }

        .buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        .difficulty-buttons {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .difficulty-btn {
            padding: 8px 15px;
            font-size: 0.9em;
            border: 2px solid white;
            background: transparent;
            color: white;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: bold;
        }

        .difficulty-btn.active {
            background: white;
            color: #667eea;
        }

        .difficulty-btn:hover {
            background: white;
            color: #667eea;
            transform: translateY(-2px);
        }

        .mode-selector {
            margin-bottom: 20px;
            font-size: 1.1em;
        }

        .mode-btn {
            margin: 5px;
            padding: 10px 20px;
            font-size: 0.95em;
            border: 2px solid white;
            background: transparent;
            color: white;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: bold;
        }

        .mode-btn.active {
            background: white;
            color: #667eea;
        }

        button {
            padding: 12px 30px;
            font-size: 1em;
            border: 2px solid white;
            background: transparent;
            color: white;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: bold;
        }

        button:hover {
            background: white;
            color: #667eea;
            transform: translateY(-2px);
        }

        .reset-btn {
            background: white;
            color: #667eea;
            border-color: white;
        }

        .reset-btn:hover {
            background: rgba(255, 255, 255, 0.9);
        }

        .back-link {
            display: inline-block;
            margin-top: 20px;
            color: white;
            text-decoration: none;
            opacity: 0.8;
            transition: opacity 0.3s ease;
        }

        .back-link:hover {
            opacity: 1;
        }
    </style>
</head>
<body>
    <div id="navbar-container"></div>
    <div class="container">
        <h1>⭕ Tic Tac Toe</h1>
        
        <div class="mode-selector">
            <button class="mode-btn active" onclick="setGameMode('pvp')">Player vs Player</button>
            <button class="mode-btn" onclick="setGameMode('pva')">Player vs AI</button>
        </div>

        <div id="difficultyContainer" style="display: none;" class="difficulty-buttons">
            <button class="difficulty-btn active" onclick="setDifficulty('easy')">Easy</button>
            <button class="difficulty-btn" onclick="setDifficulty('medium')">Medium</button>
            <button class="difficulty-btn" onclick="setDifficulty('hard')">Hard</button>
            <button class="difficulty-btn" onclick="setDifficulty('impossible')">Impossible</button>
        </div>
        
        <div class="status playing" id="status">Player X's Turn</div>
        
        <div class="game-board" id="board">
            <button class="cell" data-index="0"></button>
            <button class="cell" data-index="1"></button>
            <button class="cell" data-index="2"></button>
            <button class="cell" data-index="3"></button>
            <button class="cell" data-index="4"></button>
            <button class="cell" data-index="5"></button>
            <button class="cell" data-index="6"></button>
            <button class="cell" data-index="7"></button>
            <button class="cell" data-index="8"></button>
        </div>

        <div class="buttons">
            <button class="reset-btn" onclick="resetGame()">New Game</button>
        </div>

        <a href="/" class="back-link">← Back to Home</a>
    </div>

    <script>
        let board = ['', '', '', '', '', '', '', '', ''];
        let currentPlayer = 'X';
        let gameActive = true;
        let gameMode = 'pvp'; // 'pvp' or 'pva'
        let difficulty = 'medium';
        let aiPlayer = 'O';
        let humanPlayer = 'X';

        const winningConditions = [
            [0, 1, 2],
            [3, 4, 5],
            [6, 7, 8],
            [0, 3, 6],
            [1, 4, 7],
            [2, 5, 8],
            [0, 4, 8],
            [2, 4, 6]
        ];

        function setGameMode(mode) {
            gameMode = mode;
            document.querySelectorAll('.mode-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            document.getElementById('difficultyContainer').style.display = mode === 'pva' ? 'flex' : 'none';
            resetGame();
        }

        function setDifficulty(level) {
            difficulty = level;
            document.querySelectorAll('.difficulty-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            resetGame();
        }

        function makeMove(index) {
            if (board[index] === '' && gameActive && (gameMode === 'pvp' || currentPlayer === humanPlayer)) {
                board[index] = currentPlayer;
                updateBoard();
                checkWinner();
                if (gameActive && gameMode === 'pva' && currentPlayer === aiPlayer) {
                    setTimeout(makeAIMove, 500);
                }
            }
        }

        function makeAIMove() {
            if (!gameActive) return;
            let move;
            if (difficulty === 'easy') move = getEasyMove();
            else if (difficulty === 'medium') move = getMediumMove();
            else if (difficulty === 'hard') move = getHardMove();
            else move = getImpossibleMove();
            
            if (move !== -1) {
                board[move] = aiPlayer;
                updateBoard();
                checkWinner();
            }
        }

        function getEasyMove() {
            const empty = board.map((val, idx) => val === '' ? idx : -1).filter(idx => idx !== -1);
            return empty[Math.floor(Math.random() * empty.length)];
        }

        function getMediumMove() {
            // 50% random, 50% minimax
            if (Math.random() < 0.5) return getEasyMove();
            const best = getBestMove(true);
            return best !== undefined ? best : getEasyMove();
        }

        function getHardMove() {
            // Try to win, block, then use minimax
            const move = findWinningMove(aiPlayer) || findWinningMove(humanPlayer) || getBestMove(true);
            return move !== undefined ? move : getEasyMove();
        }

        function getImpossibleMove() {
            // Perfect play with minimax
            const move = getBestMove(true);
            return move !== undefined ? move : getEasyMove();
        }

        function findWinningMove(player) {
            for (let i = 0; i < 9; i++) {
                if (board[i] === '') {
                    board[i] = player;
                    for (let condition of winningConditions) {
                        const [a, b, c] = condition;
                        if (board[a] === player && board[b] === player && board[c] === player) {
                            board[i] = '';
                            return i;
                        }
                    }
                    board[i] = '';
                }
            }
            return null;
        }

        function getBestMove(isMaximizing) {
            let bestScore = isMaximizing ? -Infinity : Infinity;
            let bestMove;
            
            for (let i = 0; i < 9; i++) {
                if (board[i] === '') {
                    board[i] = isMaximizing ? aiPlayer : humanPlayer;
                    let score = minimax(0, !isMaximizing);
                    board[i] = '';
                    
                    if ((isMaximizing && score > bestScore) || (!isMaximizing && score < bestScore)) {
                        bestScore = score;
                        bestMove = i;
                    }
                }
            }
            return bestMove;
        }

        function minimax(depth, isMaximizing) {
            // Check terminal states
            for (let condition of winningConditions) {
                const [a, b, c] = condition;
                if (board[a] && board[a] === board[b] && board[a] === board[c]) {
                    return board[a] === aiPlayer ? 10 - depth : depth - 10;
                }
            }
            if (board.every(cell => cell !== '')) return 0;

            if (isMaximizing) {
                let bestScore = -Infinity;
                for (let i = 0; i < 9; i++) {
                    if (board[i] === '') {
                        board[i] = aiPlayer;
                        bestScore = Math.max(bestScore, minimax(depth + 1, false));
                        board[i] = '';
                    }
                }
                return bestScore;
            } else {
                let bestScore = Infinity;
                for (let i = 0; i < 9; i++) {
                    if (board[i] === '') {
                        board[i] = humanPlayer;
                        bestScore = Math.min(bestScore, minimax(depth + 1, true));
                        board[i] = '';
                    }
                }
                return bestScore;
            }
        }

        function updateBoard() {
            document.querySelectorAll('.cell').forEach(cell => {
                const index = cell.dataset.index;
                cell.textContent = board[index];
            });
        }

        function checkWinner() {
            for (let condition of winningConditions) {
                const [a, b, c] = condition;
                if (board[a] && board[a] === board[b] && board[a] === board[c]) {
                    updateStatus(`Player ${currentPlayer} Wins! 🎉`, 'win');
                    gameActive = false;
                    return;
                }
            }

            if (board.every(cell => cell !== '')) {
                updateStatus("It's a Draw! 🤝", 'draw');
                gameActive = false;
                return;
            }

            currentPlayer = currentPlayer === 'X' ? 'O' : 'X';
            updateStatus(`Player ${currentPlayer}'s Turn`);
        }

        function updateStatus(message, className = '') {
            const status = document.getElementById('status');
            status.textContent = message;
            status.className = 'status ' + className;
        }

        function resetGame() {
            board = ['', '', '', '', '', '', '', '', ''];
            currentPlayer = humanPlayer;
            gameActive = true;
            updateBoard();
            updateStatus(gameMode === 'pva' ? `Your Turn (${humanPlayer})` : `Player X's Turn`);
        }

        document.querySelectorAll('.cell').forEach(cell => {
            cell.addEventListener('click', () => makeMove(parseInt(cell.dataset.index)));
        });

        updateBoard();
    </script>
<div id="footer-container"></div>
    <script>
        fetch('/partials/navbar.html').then(r => r.text()).then(html => {
            document.getElementById('navbar-container').innerHTML = html;
        });
        fetch('/partials/footer.html').then(r => r.text()).then(html => {
            document.getElementById('footer-container').innerHTML = html;
        });
    </script>
</body>
</html>
