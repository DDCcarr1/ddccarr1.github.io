<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>DDCcarr1 | Block Breaker</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 0;
            margin: 0;
            overflow-x: hidden;
        }

        #navbar-container {
            flex-shrink: 0;
        }

        #footer-container {
            flex-shrink: 0;
            margin-top: auto;
        }

        .container {
            text-align: center;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex: 1;
            padding: 10px;
            width: 100%;
        }

        h1 {
            font-size: 2.5em;
            margin-bottom: 15px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        .info-bar {
            display: flex;
            justify-content: space-around;
            margin-bottom: 15px;
            gap: 10px;
            flex-wrap: wrap;
            width: 100%;
        }

        .info-item {
            background: rgba(255, 255, 255, 0.2);
            padding: 8px 15px;
            border-radius: 8px;
            backdrop-filter: blur(10px);
            font-size: 0.95em;
        }

        #gameCanvas {
            background: #1a1a1a;
            border: 3px solid white;
            border-radius: 8px;
            display: block;
            margin: 15px auto;
            image-rendering: pixelated;
            max-width: 95vw;
            height: auto;
            touch-action: none;
        }

        .controls {
            margin-top: 15px;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
            width: 100%;
        }

        button {
            background: white;
            color: #667eea;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 0.95em;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            touch-action: manipulation;
        }

        button:active {
            transform: scale(0.95);
        }

        button:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .message {
            font-size: 1.3em;
            margin-top: 15px;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        .back-link {
            display: inline-block;
            color: white;
            text-decoration: none;
            margin-bottom: 10px;
            opacity: 0.8;
            transition: opacity 0.3s ease;
            font-size: 1em;
        }

        .back-link:hover {
            opacity: 1;
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 1.8em;
                margin-bottom: 10px;
            }

            .info-item {
                font-size: 0.85em;
                padding: 6px 12px;
            }

            button {
                padding: 8px 16px;
                font-size: 0.85em;
            }

            .message {
                font-size: 1.1em;
            }
        }
    </style>
</head>
<body>
    <div id="navbar-container"></div>
    <div class="container">
        <a href="/games" class="back-link">← Back to Games</a>
        <h1>🧱 Block Breaker</h1>
        
        <div class="info-bar">
            <div class="info-item">Score: <span id="score">0</span></div>
            <div class="info-item">Lives: <span id="lives">3</span></div>
        </div>

        <canvas id="gameCanvas" width="400" height="600"></canvas>

        <div class="controls">
            <button onclick="newGame()">New Game</button>
            <button onclick="togglePause()">Pause</button>
        </div>

        <div class="message" id="message"></div>
        <p style="opacity: 0.8; font-size: 0.9em; margin-top: 10px;">👆 Move paddle by touching/clicking or using arrow keys</p>
    </div>
    <div id="footer-container"></div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        let paddle = {x: canvas.width / 2 - 40, y: canvas.height - 20, width: 80, height: 10};
        let ball = {x: canvas.width / 2, y: canvas.height - 40, radius: 5, dx: 3, dy: -3};
        let bricks = [];
        let score = 0;
        let lives = 3;
        let gameOver = false;
        let gameLost = false;
        let paused = false;
        let mouseX = canvas.width / 2;

        function createBricks() {
            bricks = [];
            const brickWidth = 75;
            const brickHeight = 15;
            const brickPadding = 5;
            const cols = Math.floor(canvas.width / (brickWidth + brickPadding));
            const rows = 4;
            
            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    bricks.push({
                        x: c * (brickWidth + brickPadding) + 5,
                        y: r * (brickHeight + brickPadding) + 30,
                        width: brickWidth,
                        height: brickHeight,
                        active: true
                    });
                }
            }
        }

        function newGame() {
            paddle = {x: canvas.width / 2 - 40, y: canvas.height - 20, width: 80, height: 10};
            ball = {x: canvas.width / 2, y: canvas.height - 40, radius: 5, dx: 3, dy: -3};
            score = 0;
            lives = 3;
            gameOver = false;
            gameLost = false;
            paused = false;
            document.getElementById('score').textContent = score;
            document.getElementById('lives').textContent = lives;
            document.getElementById('message').textContent = '';
            createBricks();
            gameLoop();
        }

        function togglePause() {
            if (!gameOver && !gameLost) {
                paused = !paused;
                if (!paused) gameLoop();
            }
        }

        function update() {
            if (paused || gameOver || gameLost) return;

            paddle.x = mouseX - paddle.width / 2;
            if (paddle.x < 0) paddle.x = 0;
            if (paddle.x + paddle.width > canvas.width) paddle.x = canvas.width - paddle.width;

            ball.x += ball.dx;
            ball.y += ball.dy;

            if (ball.x - ball.radius < 0 || ball.x + ball.radius > canvas.width) {
                ball.dx = -ball.dx;
                ball.x = Math.max(ball.radius, Math.min(canvas.width - ball.radius, ball.x));
            }

            if (ball.y - ball.radius < 0) {
                ball.dy = -ball.dy;
            }

            if (ball.y + ball.radius > canvas.height) {
                lives--;
                document.getElementById('lives').textContent = lives;
                if (lives <= 0) {
                    gameLost = true;
                    document.getElementById('message').textContent = '💥 Game Over! Final Score: ' + score;
                } else {
                    ball = {x: canvas.width / 2, y: canvas.height - 40, radius: 5, dx: 3, dy: -3};
                }
                return;
            }

            if (ball.y + ball.radius > paddle.y && 
                ball.y - ball.radius < paddle.y + paddle.height &&
                ball.x > paddle.x && 
                ball.x < paddle.x + paddle.width) {
                ball.dy = -ball.dy;
                ball.y = paddle.y - ball.radius;
                ball.dx += (ball.x - (paddle.x + paddle.width / 2)) * 0.05;
            }

            for (let brick of bricks) {
                if (!brick.active) continue;
                if (ball.x + ball.radius > brick.x &&
                    ball.x - ball.radius < brick.x + brick.width &&
                    ball.y + ball.radius > brick.y &&
                    ball.y - ball.radius < brick.y + brick.height) {
                    brick.active = false;
                    ball.dy = -ball.dy;
                    score += 10;
                    document.getElementById('score').textContent = score;
                }
            }

            if (bricks.every(b => !b.active)) {
                gameOver = true;
                document.getElementById('message').textContent = '🎉 You Won! Score: ' + score;
            }
        }

        function draw() {
            ctx.fillStyle = '#1a1a1a';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = '#00ff00';
            ctx.fillRect(paddle.x, paddle.y, paddle.width, paddle.height);

            ctx.fillStyle = '#ffff00';
            ctx.beginPath();
            ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#ff6600';
            for (let brick of bricks) {
                if (brick.active) {
                    ctx.fillRect(brick.x, brick.y, brick.width, brick.height);
                }
            }

            if (paused) {
                ctx.fillStyle = 'rgba(0, 0, 0, 0.5)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = 'white';
                ctx.font = '30px Arial';
                ctx.textAlign = 'center';
                ctx.fillText('PAUSED', canvas.width / 2, canvas.height / 2);
            }
        }

        function gameLoop() {
            if (!paused && !gameOver && !gameLost) {
                update();
                draw();
                requestAnimationFrame(gameLoop);
            } else {
                draw();
            }
        }

        canvas.addEventListener('mousemove', (e) => {
            const rect = canvas.getBoundingClientRect();
            mouseX = e.clientX - rect.left;
        });

        canvas.addEventListener('touchmove', (e) => {
            e.preventDefault();
            const rect = canvas.getBoundingClientRect();
            mouseX = e.touches[0].clientX - rect.left;
        }, {passive: false});

        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft') mouseX = Math.max(0, mouseX - 10);
            if (e.key === 'ArrowRight') mouseX = Math.min(canvas.width, mouseX + 10);
        });

        newGame();

        fetch('/partials/navbar.html').then(r => r.text()).then(html => {
            document.getElementById('navbar-container').innerHTML = html;
        });
        fetch('/partials/footer.html').then(r => r.text()).then(html => {
            document.getElementById('footer-container').innerHTML = html;
        });
    </script>
</body>
</html>
