<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>DDCcarr1 | Flappy Bird</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 0;
            margin: 0;
            overflow-x: hidden;
        }

        #navbar-container {
            flex-shrink: 0;
        }

        #footer-container {
            flex-shrink: 0;
            margin-top: auto;
        }

        .container {
            text-align: center;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex: 1;
            padding: 10px;
            width: 100%;
        }

        h1 {
            font-size: 2em;
            margin-bottom: 15px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        .info-bar {
            display: flex;
            justify-content: space-around;
            margin-bottom: 15px;
            gap: 10px;
            flex-wrap: wrap;
        }

        .info-item {
            background: rgba(255, 255, 255, 0.2);
            padding: 8px 15px;
            border-radius: 8px;
            backdrop-filter: blur(10px);
            font-size: 0.9em;
        }

        #gameCanvas {
            background: linear-gradient(180deg, #87CEEB 0%, #E0F6FF 100%);
            border: 3px solid white;
            border-radius: 8px;
            display: block;
            margin: 15px auto;
            max-width: 95vw;
            height: auto;
            touch-action: none;
        }

        .controls {
            margin-top: 15px;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
        }

        button {
            background: white;
            color: #667eea;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 0.9em;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            touch-action: manipulation;
        }

        button:active {
            transform: scale(0.95);
        }

        button:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .message {
            font-size: 1.3em;
            margin-top: 15px;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        .back-link {
            display: inline-block;
            color: white;
            text-decoration: none;
            margin-bottom: 10px;
            opacity: 0.8;
            transition: opacity 0.3s ease;
            font-size: 1em;
        }

        .back-link:hover {
            opacity: 1;
        }

        .instructions {
            font-size: 0.85em;
            opacity: 0.9;
            margin-top: 10px;
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 1.6em;
            }

            button {
                padding: 8px 16px;
                font-size: 0.85em;
            }
        }

        @media (max-width: 480px) {
            h1 {
                font-size: 1.3em;
            }

            button {
                padding: 6px 12px;
                font-size: 0.75em;
            }
        }
    </style>
</head>
<body>
    <div id="navbar-container"></div>
    <div class="container">
        <a href="/games" class="back-link">← Back to Games</a>
        <h1>🐦 Flappy Bird</h1>
        
        <div class="info-bar">
            <div class="info-item">Score: <span id="score">0</span></div>
            <div class="info-item">Best: <span id="best">0</span></div>
        </div>

        <canvas id="gameCanvas" width="320" height="480"></canvas>

        <div class="controls">
            <button onclick="newGame()">New Game</button>
        </div>

        <div class="message" id="message"></div>
        <p class="instructions">👆 Click or tap to flap | Avoid the pipes!</p>
    </div>
    <div id="footer-container"></div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        let bird = {x: 50, y: canvas.height / 2, size: 15, velocity: 0, gravity: 0.5, lift: -10};
        let pipes = [];
        let score = 0;
        let best = localStorage.getItem('flappyBirdBest') || 0;
        let gameOver = false;
        let gameStarted = false;
        let pipeWidth = 60;
        let pipeGap = 140;
        let pipeDistance = 250;

        document.getElementById('best').textContent = best;

        function newGame() {
            bird = {x: 50, y: canvas.height / 2, size: 15, velocity: 0, gravity: 0.5, lift: -10};
            pipes = [];
            score = 0;
            gameOver = false;
            gameStarted = false;
            document.getElementById('message').textContent = '';
            document.getElementById('score').textContent = score;
            for (let i = 0; i < 3; i++) {
                createPipe(canvas.width + i * pipeDistance);
            }
            draw();
        }

        function createPipe(x) {
            const gapStart = Math.random() * (canvas.height - pipeGap - 100) + 50;
            pipes.push({
                x: x,
                gapStart: gapStart,
                gapEnd: gapStart + pipeGap,
                scored: false
            });
        }

        function update() {
            if (!gameStarted || gameOver) return;

            bird.velocity += bird.gravity;
            bird.y += bird.velocity;

            if (bird.y - bird.size < 0 || bird.y + bird.size > canvas.height) {
                gameOver = true;
                document.getElementById('message').textContent = '💥 Game Over! Final Score: ' + score;
                if (score > best) {
                    best = score;
                    localStorage.setItem('flappyBirdBest', best);
                    document.getElementById('best').textContent = best;
                }
                return;
            }

            for (let pipe of pipes) {
                pipe.x -= 5;

                if (pipe.x + pipeWidth < bird.x - bird.size && !pipe.scored) {
                    pipe.scored = true;
                    score++;
                    document.getElementById('score').textContent = score;
                }

                if (bird.x + bird.size > pipe.x && bird.x - bird.size < pipe.x + pipeWidth) {
                    if (bird.y - bird.size < pipe.gapStart || bird.y + bird.size > pipe.gapEnd) {
                        gameOver = true;
                        document.getElementById('message').textContent = '💥 Game Over! Final Score: ' + score;
                        if (score > best) {
                            best = score;
                            localStorage.setItem('flappyBirdBest', best);
                            document.getElementById('best').textContent = best;
                        }
                    }
                }
            }

            if (pipes[0].x < -pipeWidth) {
                pipes.shift();
                createPipe(pipes[pipes.length - 1].x + pipeDistance);
            }
        }

        function draw() {
            ctx.fillStyle = '#87CEEB';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = '#333';
            for (let pipe of pipes) {
                ctx.fillRect(pipe.x, 0, pipeWidth, pipe.gapStart);
                ctx.fillRect(pipe.x, pipe.gapEnd, pipeWidth, canvas.height - pipe.gapEnd);
            }

            ctx.fillStyle = '#FFD700';
            ctx.beginPath();
            ctx.arc(bird.x, bird.y, bird.size, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#000';
            ctx.beginPath();
            ctx.arc(bird.x + 5, bird.y - 5, 3, 0, Math.PI * 2);
            ctx.fill();
        }

        function gameLoop() {
            update();
            draw();
            if (!gameOver && gameStarted) requestAnimationFrame(gameLoop);
        }

        canvas.addEventListener('click', () => {
            if (!gameStarted && !gameOver) {
                gameStarted = true;
                gameLoop();
            } else if (gameOver) {
                newGame();
            } else {
                bird.velocity = bird.lift;
            }
        });

        canvas.addEventListener('touchstart', () => {
            if (!gameStarted && !gameOver) {
                gameStarted = true;
                gameLoop();
            } else if (gameOver) {
                newGame();
            } else {
                bird.velocity = bird.lift;
            }
        }, {passive: true});

        document.addEventListener('keydown', (e) => {
            if (e.key === ' ') {
                if (!gameStarted && !gameOver) {
                    gameStarted = true;
                    gameLoop();
                } else if (gameOver) {
                    newGame();
                } else {
                    bird.velocity = bird.lift;
                }
            }
        });

        newGame();

        fetch('/partials/navbar.html').then(r => r.text()).then(html => {
            document.getElementById('navbar-container').innerHTML = html;
        });
        fetch('/partials/footer.html').then(r => r.text()).then(html => {
            document.getElementById('footer-container').innerHTML = html;
        });
    </script>
</body>
</html>
