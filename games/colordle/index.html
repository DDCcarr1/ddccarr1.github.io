<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>DDCcarr1 | Colordle</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 0;
            margin: 0;
            overflow-x: hidden;
        }

        #navbar-container {
            flex-shrink: 0;
        }

        #footer-container {
            flex-shrink: 0;
            margin-top: auto;
        }

        .container {
            max-width: 500px;
            width: 100%;
            color: white;
            margin: 0 auto;
            padding: 10px;
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 2em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        .subtitle {
            font-size: 0.95em;
            opacity: 0.8;
        }

        .game-container {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 15px;
            backdrop-filter: blur(10px);
            margin-bottom: 15px;
        }

        .target-section {
            text-align: center;
            margin-bottom: 20px;
        }

        .target-label {
            font-size: 0.75em;
            opacity: 0.8;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .target-color {
            width: 120px;
            height: 120px;
            border-radius: 12px;
            margin: 0 auto;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
            border: 3px solid rgba(255, 255, 255, 0.3);
        }

        .status-message {
            text-align: center;
            font-size: 1em;
            font-weight: bold;
            margin-bottom: 15px;
            min-height: 30px;
        }

        .guesses-grid {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 15px;
            max-height: 280px;
            overflow-y: auto;
        }

        .guess-row {
            display: flex;
            gap: 10px;
            align-items: center;
            padding: 10px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        .guess-color-box {
            width: 60px;
            height: 60px;
            border-radius: 10px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            flex-shrink: 0;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
        }

        .guess-info {
            flex: 1;
        }

        .guess-hex {
            font-size: 0.85em;
            font-weight: bold;
            font-family: 'Courier New', monospace;
            margin-bottom: 3px;
            letter-spacing: 2px;
        }

        .hex-char {
            display: inline-block;
            width: 20px;
            height: 24px;
            line-height: 24px;
            text-align: center;
            border-radius: 4px;
            margin: 0 1px;
        }

        .hex-char.correct {
            background-color: #4ade80;
            color: white;
        }

        .hex-char.present {
            background-color: #fbbf24;
            color: #333;
        }

        .hex-char.absent {
            background-color: rgba(255, 255, 255, 0.2);
            color: white;
        }

        .guess-distance {
            font-size: 0.85em;
            opacity: 0.8;
        }

        .distance-bar {
            width: 100%;
            height: 4px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 2px;
            margin-top: 6px;
            overflow: hidden;
        }

        .distance-fill {
            height: 100%;
            background: linear-gradient(90deg, #4ade80, #fbbf24, #ef4444);
            border-radius: 2px;
        }

        .input-section {
            margin-bottom: 12px;
        }

        .input-label {
            font-size: 0.75em;
            opacity: 0.8;
            margin-bottom: 6px;
            display: block;
        }

        .input-group {
            display: flex;
            gap: 8px;
        }

        .hex-input {
            flex: 1;
            padding: 10px;
            font-size: 0.9em;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            text-align: center;
            text-transform: uppercase;
            touch-action: manipulation;
        }
            font-weight: bold;
            backdrop-filter: blur(10px);
            transition: border-color 0.3s ease;
        }

        .hex-input:focus {
            outline: none;
            border-color: white;
            background: rgba(255, 255, 255, 0.15);
        }

        .hex-input::placeholder {
            color: rgba(255, 255, 255, 0.4);
        }

        .guess-btn {
            padding: 10px 20px;
            font-size: 0.9em;
            border: 2px solid white;
            background: white;
            color: #667eea;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
            touch-action: manipulation;
        }

        .guess-btn:active:not(:disabled) {
            transform: scale(0.95);
        }

        .guess-btn:hover:not(:disabled) {
            background: rgba(255, 255, 255, 0.9);
            transform: translateY(-2px);
        }

        .guess-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .buttons {
            display: flex;
            gap: 8px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .new-game-btn {
            padding: 8px 16px;
            font-size: 0.85em;
            border: 2px solid white;
            background: transparent;
            color: white;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
            touch-action: manipulation;
        }

        .new-game-btn:active {
            transform: scale(0.95);
        }

        .new-game-btn:hover {
            background: white;
            color: #667eea;
            transform: translateY(-2px);
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 15px;
            color: white;
            text-decoration: none;
            opacity: 0.8;
            transition: opacity 0.3s ease;
        }

        .back-link:hover {
            opacity: 1;
        }

        .info-text {
            font-size: 0.8em;
            opacity: 0.7;
            text-align: center;
            margin-top: 12px;
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 1.6em;
            }

            .target-color {
                width: 100px;
                height: 100px;
            }

            .hex-input {
                font-size: 0.85em;
            }
        }

        @media (max-width: 480px) {
            h1 {
                font-size: 1.3em;
                margin-bottom: 8px;
            }

            .target-color {
                width: 80px;
                height: 80px;
            }

            .guess-row {
                padding: 8px;
                gap: 8px;
            }

            .guess-color-box {
                width: 50px;
                height: 50px;
            }

            .hex-input {
                font-size: 0.75em;
            }
        }

        .empty-row {
            display: flex;
            gap: 12px;
            padding: 12px;
        }

        .empty-tile {
            width: 70px;
            height: 70px;
            border-radius: 10px;
            border: 2px dashed rgba(255, 255, 255, 0.2);
            flex-shrink: 0;
        }

        @media (max-width: 600px) {
            h1 {
                font-size: 2em;
            }

            .target-color {
                width: 120px;
                height: 120px;
            }

            .guess-row {
                flex-wrap: wrap;
                gap: 8px;
            }

            .guess-color-box {
                width: 60px;
                height: 60px;
            }

            .input-group {
                flex-direction: column;
            }

            .guess-btn {
                width: 100%;
            }

            .buttons {
                flex-direction: column;
            }

            .new-game-btn {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div id="navbar-container"></div>
    <div class="container">
        <header>
            <h1>🎨 Colordle</h1>
            <p class="subtitle">Guess the hex code of the target color</p>
        </header>

        <div class="game-container">
            <div class="target-section">
                <div class="target-label">Target Color</div>
                <div class="target-color" id="targetColor"></div>
            </div>

            <div class="status-message" id="message"></div>

            <div class="guesses-grid" id="guessesGrid">
                <div class="empty-row">
                    <div class="empty-tile"></div>
                </div>
            </div>

            <div class="input-section">
                <label class="input-label">Enter hex code</label>
                <div class="input-group">
                    <input type="text" class="hex-input" id="hexInput" placeholder="#000000" maxlength="7">
                    <button class="guess-btn" id="guessBtn" onclick="submitGuess()">Guess</button>
                </div>
            </div>

            <div class="buttons">
                <button class="new-game-btn" onclick="newGame()">New Game</button>
            </div>

            <div class="info-text">
                Get as close as possible to match the color!
            </div>
        </div>

        <a href="/" class="back-link">← Back to Home</a>
    </div>

    <script>
        let targetHex, guesses = [], gameActive = true;

        function randomColor() {
            return '#' + Math.floor(Math.random() * 16777215).toString(16).padStart(6, '0').toUpperCase();
        }

        function hexToRgb(hex) {
            const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
            return result ? {
                r: parseInt(result[1], 16),
                g: parseInt(result[2], 16),
                b: parseInt(result[3], 16)
            } : null;
        }

        function colorDistance(hex1, hex2) {
            const rgb1 = hexToRgb(hex1);
            const rgb2 = hexToRgb(hex2);

            if (!rgb1 || !rgb2) return Infinity;

            const rDiff = rgb1.r - rgb2.r;
            const gDiff = rgb1.g - rgb2.g;
            const bDiff = rgb1.b - rgb2.b;

            return Math.sqrt(rDiff * rDiff + gDiff * gDiff + bDiff * bDiff);
        }

        function getClosenessMessage(distance) {
            if (distance === 0) return '🎉 Perfect Match!';
            if (distance < 30) return '🔥 Extremely Close!';
            if (distance < 60) return '🔥 Very Close!';
            if (distance < 100) return '😊 Close';
            if (distance < 150) return '🤔 Getting Warmer';
            if (distance < 200) return '❄️ Far';
            return '❄️ Very Far';
        }

        function newGame() {
            targetHex = randomColor();
            guesses = [];
            gameActive = true;
            document.getElementById('message').textContent = '';
            document.getElementById('message').className = 'status-message';
            document.getElementById('hexInput').value = '';
            document.getElementById('guessBtn').disabled = false;
            updateTargetColor();
            renderGuesses();
        }

        function updateTargetColor() {
            document.getElementById('targetColor').style.backgroundColor = targetHex;
        }

        function submitGuess() {
            if (!gameActive) return;

            let hex = document.getElementById('hexInput').value.toUpperCase();

            if (!hex.startsWith('#')) {
                hex = '#' + hex;
            }

            if (!/^#[0-9A-F]{6}$/.test(hex)) {
                document.getElementById('message').textContent = 'Invalid format. Use #RRGGBB.';
                return;
            }

            const distance = colorDistance(hex, targetHex);
            guesses.push({ hex, distance });

            if (hex === targetHex) {
                document.getElementById('message').textContent = '🎉 You Got It.';
                document.getElementById('message').className = 'status-message win';
                gameActive = false;
                document.getElementById('guessBtn').disabled = true;
            } else {
                const message = getClosenessMessage(distance);
                document.getElementById('message').textContent = message;
                document.getElementById('message').className = distance < 100 ? 'status-message close' : 'status-message';
            }

            document.getElementById('hexInput').value = '';
            renderGuesses();
        }

        function getHexFeedback(guessHex, targetHex) {
            const guessChars = guessHex.substring(1).toUpperCase().split('');
            const targetChars = targetHex.substring(1).toUpperCase().split('');
            const result = new Array(guessChars.length);
            const targetCharCounts = {};
            
            // Count available characters in target
            targetChars.forEach(char => {
                targetCharCounts[char] = (targetCharCounts[char] || 0) + 1;
            });
            
            // First pass: mark correct positions
            guessChars.forEach((char, index) => {
                if (char === targetChars[index]) {
                    result[index] = 'correct';
                    targetCharCounts[char]--;
                }
            });
            
            // Second pass: mark present/absent
            guessChars.forEach((char, index) => {
                if (result[index] === undefined) {
                    if (targetCharCounts[char] > 0) {
                        result[index] = 'present';
                        targetCharCounts[char]--;
                    } else {
                        result[index] = 'absent';
                    }
                }
            });
            
            return result.map((status, index) => {
                const char = guessChars[index];
                return `<span class="hex-char ${status}">${char}</span>`;
            }).join('');
        }

        function renderGuesses() {
            const grid = document.getElementById('guessesGrid');
            
            if (guesses.length === 0) {
                grid.innerHTML = '<div class="empty-row"><div class="empty-tile"></div></div>';
                return;
            }

            grid.innerHTML = guesses.map((g, i) => {
                const maxDistance = Math.sqrt(255*255 + 255*255 + 255*255);
                const distancePercent = Math.min((g.distance / maxDistance) * 100, 100);
                const hexFeedback = getHexFeedback(g.hex, targetHex);
                
                return `
                    <div class="guess-row">
                        <div class="guess-color-box" style="background-color: ${g.hex}"></div>
                        <div class="guess-info">
                            <div class="guess-hex">#${hexFeedback}</div>
                            <div class="guess-distance">Distance: ${Math.round(g.distance)}</div>
                            <div class="distance-bar">
                                <div class="distance-fill" style="width: ${distancePercent}%"></div>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        document.getElementById('hexInput').addEventListener('keypress', e => {
            if (e.key === 'Enter') submitGuess();
        });

        newGame();
    </script>
<div id="footer-container"></div>
    <script>
        fetch('/partials/navbar.html').then(r => r.text()).then(html => {
            document.getElementById('navbar-container').innerHTML = html;
        });
        fetch('/partials/footer.html').then(r => r.text()).then(html => {
            document.getElementById('footer-container').innerHTML = html;
        });
    </script>
</body>
</html>
