<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe | DDCcarr1</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f2027 0%, #203a43 50%, #2c5364 100%);
            color: #f5f4f0;
            padding: 1rem;
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        h1 {
            text-align: center;
            margin: 0 0 1rem 0;
            font-size: 2rem;
            text-shadow: 0 2px 10px rgba(0,0,0,.6);
        }
        .container {
            max-width: 600px;
            width: 100%;
        }
        .info {
            text-align: center;
            margin: 0 0 1.5rem 0;
            font-size: 1.1rem;
        }
        .board {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            background: rgba(0,0,0,.3);
            padding: 15px;
            border-radius: 10px;
            margin: 0 auto 1.5rem;
            max-width: 360px;
        }
        .cell {
            width: 100%;
            aspect-ratio: 1;
            background: #1b2430;
            border: 2px solid rgba(255,255,255,.1);
            border-radius: 8px;
            font-size: 2rem;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #34a853;
            transition: all .25s;
            box-shadow: 0 6px 16px rgba(0,0,0,.6);
        }
        .cell:hover:not(.taken) {
            background: #2a3a48;
            transform: scale(1.05);
        }
        .cell.taken {
            cursor: default;
        }
        .cell.x { color: #3498db; }
        .cell.o { color: #e74c3c; }
        .controls {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }
        button {
            background: #34a853;
            border: none;
            color: #fff;
            padding: .6rem 1.2rem;
            font-size: 1rem;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: all .25s;
            box-shadow: 0 6px 14px rgba(52,168,83,.25);
        }
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(52,168,83,.32);
        }
        #message {
            text-align: center;
            font-size: 1.1rem;
            min-height: 1.5rem;
            margin-top: 1rem;
            font-weight: 600;
            color: #ffd700;
        }
    </style>
</head>
<body>
    <h1>Tic Tac Toe</h1>
    <div class="container">
        <div class="info">
            <div id="status">Player X's Turn</div>
        </div>
        <div class="board" id="board">
            <div class="cell" data-index="0"></div>
            <div class="cell" data-index="1"></div>
            <div class="cell" data-index="2"></div>
            <div class="cell" data-index="3"></div>
            <div class="cell" data-index="4"></div>
            <div class="cell" data-index="5"></div>
            <div class="cell" data-index="6"></div>
            <div class="cell" data-index="7"></div>
            <div class="cell" data-index="8"></div>
        </div>
        <div class="controls">
            <button id="new-game">New Game</button>
        </div>
        <div id="message"></div>
    </div>

    <script>
        const cells = document.querySelectorAll('.cell');
        const statusDisplay = document.getElementById('status');
        const messageDisplay = document.getElementById('message');
        const newGameBtn = document.getElementById('new-game');

        let board = ['', '', '', '', '', '', '', '', ''];
        let currentPlayer = 'X';
        let gameActive = true;

        const winPatterns = [
            [0, 1, 2],
            [3, 4, 5],
            [6, 7, 8],
            [0, 3, 6],
            [1, 4, 7],
            [2, 5, 8],
            [0, 4, 8],
            [2, 4, 6]
        ];

        function updateDisplay() {
            cells.forEach((cell, index) => {
                cell.textContent = board[index];
                cell.classList.remove('x', 'o', 'taken');
                if (board[index]) {
                    cell.classList.add('taken', board[index].toLowerCase());
                }
            });
        }

        function checkWinner() {
            for (let pattern of winPatterns) {
                const [a, b, c] = pattern;
                if (board[a] && board[a] === board[b] && board[a] === board[c]) {
                    return board[a];
                }
            }
            return null;
        }

        function isBoardFull() {
            return board.every(cell => cell !== '');
        }

        function handleCellClick(e) {
            const cell = e.target;
            const index = parseInt(cell.dataset.index);

            if (board[index] !== '' || !gameActive) return;

            board[index] = currentPlayer;
            updateDisplay();

            const winner = checkWinner();
            if (winner) {
                messageDisplay.textContent = `${winner} wins! 🎉`;
                statusDisplay.textContent = `${winner} wins!`;
                gameActive = false;
                return;
            }

            if (isBoardFull()) {
                messageDisplay.textContent = `It's a draw! 🤝`;
                statusDisplay.textContent = 'Draw';
                gameActive = false;
                return;
            }

            currentPlayer = currentPlayer === 'X' ? 'O' : 'X';
            statusDisplay.textContent = `Player ${currentPlayer}'s Turn`;
        }

        function resetGame() {
            board = ['', '', '', '', '', '', '', '', ''];
            currentPlayer = 'X';
            gameActive = true;
            messageDisplay.textContent = '';
            statusDisplay.textContent = `Player ${currentPlayer}'s Turn`;
            updateDisplay();
        }

        cells.forEach(cell => cell.addEventListener('click', handleCellClick));
        newGameBtn.addEventListener('click', resetGame);
        updateDisplay();
    </script>
</body>
</html>
