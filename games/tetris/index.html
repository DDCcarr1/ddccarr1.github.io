<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>DDCcarr1 | Tetris</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 0;
            margin: 0;
            overflow-x: hidden;
        }

        #navbar-container {
            flex-shrink: 0;
        }

        #footer-container {
            flex-shrink: 0;
            margin-top: auto;
        }

        .container {
            text-align: center;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex: 1;
            padding: 10px;
            width: 100%;
        }

        h1 {
            font-size: 2em;
            margin-bottom: 15px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        .info-bar {
            display: flex;
            justify-content: space-around;
            margin-bottom: 15px;
            gap: 10px;
            flex-wrap: wrap;
        }

        .info-item {
            background: rgba(255, 255, 255, 0.2);
            padding: 8px 15px;
            border-radius: 8px;
            backdrop-filter: blur(10px);
            font-size: 0.9em;
        }

        #gameCanvas {
            background: #000;
            border: 3px solid white;
            border-radius: 8px;
            display: block;
            margin: 15px auto;
            image-rendering: pixelated;
            max-width: 95vw;
            height: auto;
            touch-action: none;
        }

        .controls {
            margin-top: 15px;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
        }

        button {
            background: white;
            color: #667eea;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 0.9em;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            touch-action: manipulation;
        }

        button:active {
            transform: scale(0.95);
        }

        button:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .message {
            font-size: 1.3em;
            margin-top: 15px;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        .back-link {
            display: inline-block;
            color: white;
            text-decoration: none;
            margin-bottom: 10px;
            opacity: 0.8;
            transition: opacity 0.3s ease;
            font-size: 1em;
        }

        .back-link:hover {
            opacity: 1;
        }

        .instructions {
            font-size: 0.85em;
            opacity: 0.9;
            margin-top: 10px;
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 1.6em;
            }

            button {
                padding: 8px 16px;
                font-size: 0.85em;
            }
        }

        @media (max-width: 480px) {
            h1 {
                font-size: 1.3em;
            }

            button {
                padding: 6px 12px;
                font-size: 0.75em;
            }
        }
    </style>
</head>
<body>
    <div id="navbar-container"></div>
    <div class="container">
        <a href="/games" class="back-link">← Back to Games</a>
        <h1>🟧 Tetris</h1>
        
        <div class="info-bar">
            <div class="info-item">Score: <span id="score">0</span></div>
            <div class="info-item">Lines: <span id="lines">0</span></div>
            <div class="info-item">Level: <span id="level">1</span></div>
        </div>

        <canvas id="gameCanvas" width="240" height="400"></canvas>

        <div class="controls">
            <button onclick="newGame()">New Game</button>
            <button onclick="togglePause()">Pause</button>
        </div>

        <div class="message" id="message"></div>
        <p class="instructions">⬅️➡️ Move | ⬇️ Drop | 🔄 Rotate</p>
    </div>
    <div id="footer-container"></div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        const gridWidth = 10;
        const gridHeight = 20;
        const blockSize = canvas.width / gridWidth;
        let grid = [];
        let score = 0;
        let lines = 0;
        let level = 1;
        let gameOver = false;
        let paused = false;
        let currentPiece = null;
        let nextPiece = null;

        const pieces = [
            {shape: [[0,0],[1,0],[0,1],[1,1]], color: '#ff0000'}, // O
            {shape: [[0,0],[1,0],[2,0],[3,0]], color: '#00ff00'}, // I
            {shape: [[0,0],[1,0],[2,0],[2,1]], color: '#0000ff'}, // L
            {shape: [[0,0],[1,0],[2,0],[0,1]], color: '#ffff00'}, // J
            {shape: [[0,0],[1,0],[1,1],[2,1]], color: '#ff00ff'}, // S
            {shape: [[1,0],[2,0],[0,1],[1,1]], color: '#00ffff'}, // Z
            {shape: [[1,0],[0,1],[1,1],[2,1]], color: '#ff8800'}  // T
        ];

        function initGrid() {
            grid = [];
            for (let i = 0; i < gridHeight; i++) {
                grid[i] = new Array(gridWidth).fill(0);
            }
        }

        function newPiece() {
            const piece = pieces[Math.floor(Math.random() * pieces.length)];
            return {
                shape: piece.shape.map(p => [...p]),
                color: piece.color,
                x: Math.floor(gridWidth / 2) - 1,
                y: 0
            };
        }

        function newGame() {
            initGrid();
            score = 0;
            lines = 0;
            level = 1;
            gameOver = false;
            paused = false;
            document.getElementById('message').textContent = '';
            document.getElementById('score').textContent = score;
            document.getElementById('lines').textContent = lines;
            document.getElementById('level').textContent = level;
            currentPiece = newPiece();
            nextPiece = newPiece();
            gameLoop();
        }

        function togglePause() {
            if (!gameOver) {
                paused = !paused;
                if (!paused) gameLoop();
            }
        }

        function rotatePiece(piece) {
            const newShape = [];
            for (let i = 0; i < piece.shape[0].length; i++) {
                const row = [];
                for (let j = piece.shape.length - 1; j >= 0; j--) {
                    row.push(piece.shape[j][i]);
                }
                newShape.push(row);
            }
            return newShape;
        }

        function canMove(piece, dx, dy) {
            for (let [x, y] of piece.shape) {
                const nx = piece.x + x + dx;
                const ny = piece.y + y + dy;
                if (nx < 0 || nx >= gridWidth || ny >= gridHeight) return false;
                if (ny >= 0 && grid[ny][nx]) return false;
            }
            return true;
        }

        function placePiece(piece) {
            for (let [x, y] of piece.shape) {
                const gx = piece.x + x;
                const gy = piece.y + y;
                if (gy >= 0) grid[gy][gx] = piece.color;
            }
        }

        function clearLines() {
            let cleared = 0;
            for (let y = gridHeight - 1; y >= 0; y--) {
                if (grid[y].every(cell => cell)) {
                    grid.splice(y, 1);
                    grid.unshift(new Array(gridWidth).fill(0));
                    cleared++;
                }
            }
            if (cleared > 0) {
                score += cleared * 100;
                lines += cleared;
                document.getElementById('score').textContent = score;
                document.getElementById('lines').textContent = lines;
            }
        }

        function update() {
            if (paused || gameOver) return;

            if (canMove(currentPiece, 0, 1)) {
                currentPiece.y++;
            } else {
                placePiece(currentPiece);
                clearLines();
                currentPiece = nextPiece;
                nextPiece = newPiece();
                for (let [x, y] of currentPiece.shape) {
                    if (grid[currentPiece.y + y] && grid[currentPiece.y + y][currentPiece.x + x]) {
                        gameOver = true;
                        document.getElementById('message').textContent = '💥 Game Over! Score: ' + score;
                    }
                }
            }
        }

        function draw() {
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            for (let y = 0; y < gridHeight; y++) {
                for (let x = 0; x < gridWidth; x++) {
                    if (grid[y][x]) {
                        ctx.fillStyle = grid[y][x];
                        ctx.fillRect(x * blockSize, y * blockSize, blockSize - 1, blockSize - 1);
                    }
                }
            }

            if (currentPiece) {
                ctx.fillStyle = currentPiece.color;
                for (let [x, y] of currentPiece.shape) {
                    ctx.fillRect((currentPiece.x + x) * blockSize, (currentPiece.y + y) * blockSize, blockSize - 1, blockSize - 1);
                }
            }

            if (paused) {
                ctx.fillStyle = 'rgba(0, 0, 0, 0.5)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = 'white';
                ctx.font = '30px Arial';
                ctx.textAlign = 'center';
                ctx.fillText('PAUSED', canvas.width / 2, canvas.height / 2);
            }
        }

        function gameLoop() {
            if (!paused && !gameOver) {
                update();
                draw();
                setTimeout(gameLoop, Math.max(100, 400 - level * 30));
            } else {
                draw();
            }
        }

        document.addEventListener('keydown', (e) => {
            if (gameOver || paused) return;
            if (e.key === 'ArrowLeft') {
                e.preventDefault();
                if (canMove(currentPiece, -1, 0)) currentPiece.x--;
            }
            if (e.key === 'ArrowRight') {
                e.preventDefault();
                if (canMove(currentPiece, 1, 0)) currentPiece.x++;
            }
            if (e.key === 'ArrowDown') {
                e.preventDefault();
                if (canMove(currentPiece, 0, 1)) currentPiece.y++;
            }
            if (e.key === 'ArrowUp') {
                e.preventDefault();
                const rotated = {shape: rotatePiece(currentPiece), color: currentPiece.color, x: currentPiece.x, y: currentPiece.y};
                if (canMove(rotated, 0, 0)) currentPiece.shape = rotated.shape;
            }
        });

        let touchStartX = 0, touchStartY = 0;
        canvas.addEventListener('touchstart', (e) => {
            touchStartX = e.touches[0].clientX;
            touchStartY = e.touches[0].clientY;
        }, {passive: true});

        canvas.addEventListener('touchmove', (e) => {
            if (gameOver || paused) return;
            e.preventDefault();
            const touchEndX = e.touches[0].clientX;
            const touchEndY = e.touches[0].clientY;
            const diffX = touchEndX - touchStartX;
            const diffY = touchEndY - touchStartY;

            if (Math.abs(diffX) > Math.abs(diffY)) {
                if (diffX > 30 && canMove(currentPiece, -1, 0)) {
                    currentPiece.x--;
                    touchStartX = touchEndX;
                }
                if (diffX < -30 && canMove(currentPiece, 1, 0)) {
                    currentPiece.x++;
                    touchStartX = touchEndX;
                }
            } else {
                if (diffY > 30) {
                    if (canMove(currentPiece, 0, 1)) currentPiece.y++;
                    touchStartY = touchEndY;
                }
            }
        }, {passive: false});

        newGame();

        fetch('/partials/navbar.html').then(r => r.text()).then(html => {
            document.getElementById('navbar-container').innerHTML = html;
        });
        fetch('/partials/footer.html').then(r => r.text()).then(html => {
            document.getElementById('footer-container').innerHTML = html;
        });
    </script>
</body>
</html>
