<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>DDCcarr1 | 2048</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 0;
            margin: 0;
            overflow-x: hidden;
        }

        #navbar-container {
            flex-shrink: 0;
        }

        #footer-container {
            flex-shrink: 0;
            margin-top: auto;
        }

        .container {
            text-align: center;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex: 1;
            padding: 10px;
            width: 100%;
        }

        h1 {
            font-size: 2em;
            margin-bottom: 15px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        .info-bar {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }

        .info-item {
            background: rgba(255, 255, 255, 0.1);
            padding: 8px 15px;
            border-radius: 8px;
            backdrop-filter: blur(10px);
            font-size: 0.9em;
        }

        .info-label {
            font-size: 0.8em;
            opacity: 0.8;
            margin-bottom: 3px;
        }

        .info-value {
            font-size: 1.3em;
            font-weight: bold;
        }

        .game-board {
            background: rgba(0, 0, 0, 0.2);
            border-radius: 10px;
            padding: 12px;
            width: 90vw;
            max-width: 320px;
            aspect-ratio: 1;
            margin: 0 auto 20px;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            touch-action: none;
        }

        .tile {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: clamp(0.8em, 4vw, 1.5em);
            font-weight: bold;
            color: white;
            transition: all 0.1s ease;
            position: relative;
            aspect-ratio: 1;
        }

        .tile.new {
            animation: pop 0.1s ease-out;
        }

        @keyframes pop {
            0% { transform: scale(0.8); }
            100% { transform: scale(1); }
        }

        .buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        button {
            padding: 10px 20px;
            font-size: 0.9em;
            border: 2px solid white;
            background: transparent;
            color: white;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: bold;
            touch-action: manipulation;
            margin: 5px;
        }

        button:active {
            transform: scale(0.95);
        }

        button:hover {
            background: white;
            color: #667eea;
            transform: translateY(-2px);
        }

        .reset-btn {
            background: white;
            color: #667eea;
            border-color: white;
        }

        .reset-btn:hover {
            background: rgba(255, 255, 255, 0.9);
        }

        .message {
            font-size: 1.2em;
            margin-bottom: 20px;
            min-height: 30px;
        }

        .back-link {
            display: inline-block;
            margin-top: 20px;
            color: white;
            text-decoration: none;
            opacity: 0.8;
            transition: opacity 0.3s ease;
        }

        .back-link:hover {
            opacity: 1;
        }

        .instructions {
            margin-top: 15px;
            font-size: 0.85em;
            opacity: 0.8;
            max-width: 400px;
            margin-left: auto;
            margin-right: auto;
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 1.6em;
            }

            button {
                padding: 8px 16px;
                font-size: 0.85em;
            }

            .info-value {
                font-size: 1.3em;
            }
        }

        @media (max-width: 480px) {
            h1 {
                font-size: 1.3em;
            }

            button {
                padding: 6px 12px;
                font-size: 0.75em;
            }

            .info-value {
                font-size: 1.1em;
            }

            .instructions {
                font-size: 0.75em;
            }
        }
    </style>
</head>
<body>
    <div id="navbar-container"></div>
    <div class="container">
        <h1>🎯 2048</h1>
        
        <div class="info-bar">
            <div class="info-item">
                <div class="info-label">Score</div>
                <div class="info-value" id="score">0</div>
            </div>
            <div class="info-item">
                <div class="info-label">Best</div>
                <div class="info-value" id="best">0</div>
            </div>
        </div>

        <div class="message" id="message"></div>

        <div class="game-board" id="board"></div>

        <div class="buttons">
            <button onclick="newGame()">New Game</button>
        </div>

        <div class="instructions">
            <p>Use arrow keys to move tiles. Combine matching numbers to reach 2048!</p>
        </div>

        <a href="/" class="back-link">← Back to Home</a>
    </div>

    <script>
        let board = [];
        let score = 0;
        let best = localStorage.getItem('2048-best') || 0;

        function initBoard() {
            board = Array(16).fill(0);
            addNewTile();
            addNewTile();
            score = 0;
            updateDisplay();
        }

        function addNewTile() {
            let empty = board.map((v, i) => v === 0 ? i : null).filter(v => v !== null);
            if (empty.length) {
                let pos = empty[Math.floor(Math.random() * empty.length)];
                board[pos] = Math.random() < 0.9 ? 2 : 4;
            }
        }

        function move(direction) {
            let moved = false;
            let oldBoard = [...board];

            if (direction === 'left' || direction === 'right') {
                for (let i = 0; i < 4; i++) {
                    let row = board.slice(i * 4, i * 4 + 4);
                    row = direction === 'left' ? slide(row) : slide(row.reverse()).reverse();
                    board.splice(i * 4, 4, ...row);
                }
            } else {
                for (let i = 0; i < 4; i++) {
                    let col = [board[i], board[i + 4], board[i + 8], board[i + 12]];
                    col = direction === 'up' ? slide(col) : slide(col.reverse()).reverse();
                    board[i] = col[0];
                    board[i + 4] = col[1];
                    board[i + 8] = col[2];
                    board[i + 12] = col[3];
                }
            }

            moved = board.some((v, i) => v !== oldBoard[i]);
            if (moved) {
                addNewTile();
                updateDisplay();
                if (isGameOver()) {
                    document.getElementById('message').textContent = 'Game Over.';
                }
            }
        }

        function slide(row) {
            row = row.filter(v => v !== 0);
            for (let i = 0; i < row.length - 1; i++) {
                if (row[i] === row[i + 1]) {
                    row[i] *= 2;
                    score += row[i];
                    row.splice(i + 1, 1);
                }
            }
            while (row.length < 4) row.push(0);
            return row;
        }

        function isGameOver() {
            if (board.includes(0)) return false;
            for (let i = 0; i < 4; i++) {
                for (let j = 0; j < 4; j++) {
                    let current = board[i * 4 + j];
                    if ((j < 3 && current === board[i * 4 + j + 1]) ||
                        (i < 3 && current === board[(i + 1) * 4 + j])) {
                        return false;
                    }
                }
            }
            return true;
        }

        function updateDisplay() {
            if (score > best) {
                best = score;
                localStorage.setItem('2048-best', best);
                document.getElementById('best').textContent = best;
            }
            document.getElementById('score').textContent = score;

            let html = board.map(v => `<div class="tile">${v || ''}</div>`).join('');
            document.getElementById('board').innerHTML = html;
        }

        function newGame() {
            document.getElementById('message').textContent = '';
            initBoard();
        }

        document.addEventListener('keydown', e => {
            if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.key)) {
                e.preventDefault();
                const dir = { ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right' };
                move(dir[e.key]);
            }
        });

        let touchStartX = 0, touchStartY = 0;
        const board_el = document.getElementById('board');
        board_el.addEventListener('touchstart', (e) => {
            touchStartX = e.touches[0].clientX;
            touchStartY = e.touches[0].clientY;
        }, {passive: true});

        board_el.addEventListener('touchmove', (e) => {
            e.preventDefault();
        }, {passive: false});

        board_el.addEventListener('touchend', (e) => {
            const touchEndX = e.changedTouches[0].clientX;
            const touchEndY = e.changedTouches[0].clientY;
            const diffX = touchEndX - touchStartX;
            const diffY = touchEndY - touchStartY;
            
            if (Math.abs(diffX) > Math.abs(diffY)) {
                if (Math.abs(diffX) > 50) {
                    move(diffX > 0 ? 'right' : 'left');
                }
            } else {
                if (Math.abs(diffY) > 50) {
                    move(diffY > 0 ? 'down' : 'up');
                }
            }
        }, {passive: true});

        document.getElementById('best').textContent = best;
        initBoard();
    </script>
<div id="footer-container"></div>
    <script>
        fetch('/partials/navbar.html').then(r => r.text()).then(html => {
            document.getElementById('navbar-container').innerHTML = html;
        });
        fetch('/partials/footer.html').then(r => r.text()).then(html => {
            document.getElementById('footer-container').innerHTML = html;
        });
    </script>
</body>
</html>
