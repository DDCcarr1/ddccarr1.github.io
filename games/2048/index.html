<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DDCcarr1 | 2048</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            text-align: center;
            color: white;
        }

        h1 {
            font-size: 2.5em;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        .info-bar {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .info-item {
            background: rgba(255, 255, 255, 0.1);
            padding: 10px 20px;
            border-radius: 8px;
            backdrop-filter: blur(10px);
        }

        .info-label {
            font-size: 0.9em;
            opacity: 0.8;
            margin-bottom: 5px;
        }

        .info-value {
            font-size: 1.8em;
            font-weight: bold;
        }

        .game-board {
            background: rgba(0, 0, 0, 0.2);
            border-radius: 10px;
            padding: 15px;
            width: 340px;
            height: 340px;
            margin: 0 auto 30px;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }

        .tile {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8em;
            font-weight: bold;
            color: white;
            transition: all 0.1s ease;
            position: relative;
        }

        .tile.new {
            animation: pop 0.1s ease-out;
        }

        @keyframes pop {
            0% { transform: scale(0.8); }
            100% { transform: scale(1); }
        }

        .buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        button {
            padding: 12px 30px;
            font-size: 1em;
            border: 2px solid white;
            background: transparent;
            color: white;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: bold;
        }

        button:hover {
            background: white;
            color: #667eea;
            transform: translateY(-2px);
        }

        .reset-btn {
            background: white;
            color: #667eea;
            border-color: white;
        }

        .reset-btn:hover {
            background: rgba(255, 255, 255, 0.9);
        }

        .message {
            font-size: 1.2em;
            margin-bottom: 20px;
            min-height: 30px;
        }

        .back-link {
            display: inline-block;
            margin-top: 20px;
            color: white;
            text-decoration: none;
            opacity: 0.8;
            transition: opacity 0.3s ease;
        }

        .back-link:hover {
            opacity: 1;
        }

        .instructions {
            margin-top: 20px;
            font-size: 0.95em;
            opacity: 0.8;
            max-width: 400px;
            margin-left: auto;
            margin-right: auto;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎯 2048</h1>
        
        <div class="info-bar">
            <div class="info-item">
                <div class="info-label">Score</div>
                <div class="info-value" id="score">0</div>
            </div>
            <div class="info-item">
                <div class="info-label">Best</div>
                <div class="info-value" id="best">0</div>
            </div>
        </div>

        <div class="message" id="message"></div>

        <div class="game-board" id="board"></div>

        <div class="buttons">
            <button onclick="newGame()">New Game</button>
        </div>

        <div class="instructions">
            <p>Use arrow keys to move tiles. Combine matching numbers to reach 2048!</p>
        </div>

        <a href="/" class="back-link">← Back to Home</a>
    </div>

    <script>
        let board = [];
        let score = 0;
        let best = localStorage.getItem('2048-best') || 0;

        function initBoard() {
            board = Array(16).fill(0);
            addNewTile();
            addNewTile();
            score = 0;
            updateDisplay();
        }

        function addNewTile() {
            let empty = board.map((v, i) => v === 0 ? i : null).filter(v => v !== null);
            if (empty.length) {
                let pos = empty[Math.floor(Math.random() * empty.length)];
                board[pos] = Math.random() < 0.9 ? 2 : 4;
            }
        }

        function move(direction) {
            let moved = false;
            let oldBoard = [...board];

            if (direction === 'left' || direction === 'right') {
                for (let i = 0; i < 4; i++) {
                    let row = board.slice(i * 4, i * 4 + 4);
                    row = direction === 'left' ? slide(row) : slide(row.reverse()).reverse();
                    board.splice(i * 4, 4, ...row);
                }
            } else {
                for (let i = 0; i < 4; i++) {
                    let col = [board[i], board[i + 4], board[i + 8], board[i + 12]];
                    col = direction === 'up' ? slide(col) : slide(col.reverse()).reverse();
                    board[i] = col[0];
                    board[i + 4] = col[1];
                    board[i + 8] = col[2];
                    board[i + 12] = col[3];
                }
            }

            moved = board.some((v, i) => v !== oldBoard[i]);
            if (moved) {
                addNewTile();
                updateDisplay();
                if (isGameOver()) {
                    document.getElementById('message').textContent = 'Game Over!';
                }
            }
        }

        function slide(row) {
            row = row.filter(v => v !== 0);
            for (let i = 0; i < row.length - 1; i++) {
                if (row[i] === row[i + 1]) {
                    row[i] *= 2;
                    score += row[i];
                    row.splice(i + 1, 1);
                }
            }
            while (row.length < 4) row.push(0);
            return row;
        }

        function isGameOver() {
            if (board.includes(0)) return false;
            for (let i = 0; i < 4; i++) {
                for (let j = 0; j < 4; j++) {
                    let current = board[i * 4 + j];
                    if ((j < 3 && current === board[i * 4 + j + 1]) ||
                        (i < 3 && current === board[(i + 1) * 4 + j])) {
                        return false;
                    }
                }
            }
            return true;
        }

        function updateDisplay() {
            if (score > best) {
                best = score;
                localStorage.setItem('2048-best', best);
                document.getElementById('best').textContent = best;
            }
            document.getElementById('score').textContent = score;

            let html = board.map(v => `<div class="tile">${v || ''}</div>`).join('');
            document.getElementById('board').innerHTML = html;
        }

        function newGame() {
            document.getElementById('message').textContent = '';
            initBoard();
        }

        document.addEventListener('keydown', e => {
            if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.key)) {
                e.preventDefault();
                const dir = { ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right' };
                move(dir[e.key]);
            }
        });

        document.getElementById('best').textContent = best;
        initBoard();
    </script>
</body>
</html>
