<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>DDCcarr1 | Wordle</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 0;
            margin: 0;
            overflow-x: hidden;
        }

        #navbar-container {
            flex-shrink: 0;
        }

        #footer-container {
            flex-shrink: 0;
            margin-top: auto;
        }

        .container {
            text-align: center;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex: 1;
            padding: 10px;
            width: 100%;
        }

        h1 {
            font-size: 2em;
            margin-bottom: 15px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        .guesses {
            margin-bottom: 15px;
        }

        .guess-row {
            display: flex;
            gap: 6px;
            justify-content: center;
            margin-bottom: 6px;
        }

        .guess-tile {
            width: 45px;
            height: 45px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.3em;
            font-weight: bold;
            color: white;
            background: rgba(255, 255, 255, 0.1);
            transition: all 0.3s ease;
            touch-action: manipulation;
        }

        .guess-tile.correct {
            background: #4ade80;
            border-color: #4ade80;
            transform: scale(1.05);
        }

        .guess-tile.present {
            background: #fbbf24;
            border-color: #fbbf24;
            transform: scale(1.05);
        }

        .guess-tile.absent {
            background: #6b7280;
            border-color: #6b7280;
        }

        .input-section {
            margin-bottom: 15px;
            width: 100%;
        }

        .input-box {
            width: 90vw;
            max-width: 280px;
            padding: 12px;
            font-size: 1em;
            border: 2px solid white;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            text-align: center;
            text-transform: uppercase;
            font-weight: bold;
            backdrop-filter: blur(10px);
        }

        .input-box::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }

        .buttons {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }

        button {
            padding: 10px 20px;
            font-size: 0.9em;
            border: 2px solid white;
            background: transparent;
            color: white;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: bold;
            touch-action: manipulation;
        }

        button:active {
            transform: scale(0.95);
        }

        button:hover {
            background: white;
            color: #667eea;
            transform: translateY(-2px);
        }

        .guess-btn {
            background: white;
            color: #667eea;
            border-color: white;
        }

        .guess-btn:hover {
            background: rgba(255, 255, 255, 0.9);
        }

        .message {
            font-size: 1.2em;
            margin-bottom: 20px;
            min-height: 30px;
            font-weight: bold;
        }

        .message.win {
            color: #4ade80;
        }

        .message.lose {
            color: #ef4444;
        }

        .back-link {
            display: inline-block;
            margin-top: 20px;
            color: white;
            text-decoration: none;
            opacity: 0.8;
            transition: opacity 0.3s ease;
        }

        .back-link:hover {
            opacity: 1;
        }
    </style>
</head>
<body>
    <div id="navbar-container"></div>
    <div class="container">
        <h1>📝 Wordle</h1>

        <div class="guesses" id="guesses"></div>

        <div class="message" id="message"></div>

        <div class="input-section">
            <input type="text" class="input-box" id="guessInput" placeholder="Enter guess" maxlength="5">
        </div>

        <div class="buttons">
            <button class="guess-btn" onclick="submitGuess()">Guess</button>
            <button onclick="newGame()">New Game</button>
        </div>

        <a href="/" class="back-link">← Back to Home</a>
    </div>

    <script>
        let validWords = [];
        let targetWord, guesses = [], gameOver = false;

        async function loadWords() {
            try {
                const response = await fetch('https://random-word-api.herokuapp.com/all');
                const allWords = await response.json();
                validWords = allWords.filter(w => w.length === 5).map(w => w.toUpperCase());
                if (validWords.length === 0) {
                    throw new Error('No 5-letter words found');
                }
            } catch (error) {
                console.log('API failed, using fallback words');
                validWords = ['ABOUT', 'ABUSE', 'ACTOR', 'ACUTE', 'ADMIT', 'ADOPT', 'ADULT', 'AFTER', 'AGAIN', 'AGENT',
                    'AGREE', 'AHEAD', 'ALARM', 'ALBUM', 'ALERT', 'ALIEN', 'ALIGN', 'ALIKE', 'ALIVE', 'ALLOW',
                    'ALONE', 'ALONG', 'ALTER', 'AMBER', 'AMEND', 'AMONG', 'ANGER', 'ANGLE', 'ANGRY', 'APART',
                    'APPLE', 'APPLY', 'ARENA', 'ARGUE', 'ARISE', 'ARRAY', 'ARROW', 'ASIDE', 'ASSET', 'AUDIO',
                    'AUDIT', 'AVOID', 'AWAKE', 'AWARD', 'AWARE', 'BADLY', 'BAKER', 'BASES', 'BASIC', 'BASIN',
                    'BEACH', 'BEGAN', 'BEGIN', 'BEING', 'BELOW', 'BENCH', 'BILLY', 'BIRTH', 'BLACK', 'BLADE',
                    'BLAME', 'BLANK', 'BLAST', 'BLEED', 'BLEND', 'BLESS', 'BLIND', 'BLOCK', 'BLOOD', 'BOARD',
                    'BOOST', 'BOOTH', 'BOUND', 'BRAIN', 'BRAND', 'BRASS', 'BRAVE', 'BREAD', 'BREAK', 'BREED',
                    'BRIEF', 'BRING', 'BROAD', 'BROKE', 'BROWN', 'BUILD', 'BUILT', 'BURNT', 'BURST', 'BUYER',
                    'CABLE', 'CALIF', 'CAMEL', 'CANAL', 'CANDY', 'CANON', 'CAPER', 'CARGO', 'CAROL', 'CARRY',
                    'CATCH', 'CAUSE', 'CHAIN', 'CHAIR', 'CHARM', 'CHART', 'CHASE', 'CHEAP', 'CHEAT', 'CHECK',
                    'CHEST', 'CHIEF', 'CHILD', 'CHINA', 'CHOSE', 'CIVIL', 'CLAIM', 'CLASS', 'CLEAN', 'CLEAR',
                    'CLICK', 'CLIMB', 'CLOCK', 'CLOSE', 'CLOTH', 'CLOUD', 'COACH', 'COAST', 'COLON', 'COLOR',
                    'COUCH', 'COULD', 'COUNT', 'COURT', 'COVER', 'CRACK', 'CRAFT', 'CRASH', 'CRAZY', 'CREAM',
                    'CRIME', 'CRISP', 'CROSS', 'CROWD', 'CROWN', 'CRUDE', 'CRUSH', 'CURVE', 'CYCLE', 'DAILY',
                    'DAIRY', 'DANCE', 'DATED', 'DEALT', 'DEATH', 'DEBUT', 'DELAY', 'DENSE', 'DINER', 'DIRTY',
                    'DITCH', 'DIVER', 'DODGE', 'DOING', 'DONOR', 'DOUBT', 'DOZEN', 'DRAFT', 'DRAIN', 'DRANK',
                    'DRAWN', 'DREAM', 'DRESS', 'DRIED', 'DRIFT', 'DRILL', 'DRINK', 'DRIVE', 'DROIT', 'DROVE',
                    'DROWN', 'DRUNK', 'EARLY', 'EARTH', 'EATEN', 'EATER', 'EIGHT', 'EJECT', 'ELBOW', 'ELDER',
                    'ELECT', 'EMAIL', 'EMBED', 'EMBER', 'EMPTY', 'ENEMY', 'ENJOY', 'ENTER', 'ENTRY', 'EQUAL',
                    'ERROR', 'EVENT', 'EVERY', 'EXACT', 'EXCEL', 'EXILE', 'EXIST', 'EXTRA', 'FAITH', 'FALSE',
                    'FAULT', 'FIBER', 'FIELD', 'FIERY', 'FIFTH', 'FIFTY', 'FIGHT', 'FILED', 'FINAL', 'FIRST',
                    'FIXED', 'FLAME', 'FLASH', 'FLEET', 'FLESH', 'FLIER', 'FLOAT', 'FLOOD', 'FLOOR', 'FLOUR',
                    'FLOWN', 'FLUID', 'FLUSH', 'FOLIO', 'FORCE', 'FORGE', 'FORTH', 'FORTY', 'FORUM', 'FOUND',
                    'FRAME', 'FRANK', 'FRAUD', 'FREAK', 'FREED', 'FRESH', 'FRIED', 'FROCK', 'FRONT', 'FROST',
                    'FRUIT', 'FULLY', 'FUNNY', 'FUZZY', 'GAINS', 'GAILY', 'GAMER', 'GAMMA', 'GAVEL', 'GEARS',
                    'GENRE', 'GHOST', 'GIANT', 'GIDDY', 'GIVEN', 'GLAND', 'GLASS', 'GLAZE', 'GLOBE', 'GLOOM',
                    'GLORY', 'GLOVE', 'GOING', 'GRACE', 'GRADE', 'GRAIN', 'GRANT', 'GRAPE', 'GRAPH', 'GRASP',
                    'GRASS', 'GRAVE', 'GRAZE', 'GREAT', 'GREED', 'GREEN', 'GREET', 'GRIEF', 'GRILL', 'GRIME',
                    'GRIND', 'GROAN', 'GROOM', 'GROUP', 'GROVE', 'GROWL', 'GROWN', 'GUARD', 'GUESS', 'GUEST',
                    'GUIDE', 'GUILD', 'GUILT', 'GULLY', 'HABIT', 'HAPPY', 'HARDY', 'HARSH', 'HASTE', 'HASTY',
                    'HATED', 'HAUNT', 'HAVEN', 'HAVOC', 'HEADS', 'HEARD', 'HEART', 'HEATH', 'HEAVY', 'HEDGE',
                    'HEELS', 'HEIST', 'HELLO', 'HELPS', 'HERBS', 'HERDS', 'HERON', 'HILLS', 'HINGE', 'HINTS',
                    'HOBBY', 'HOLDS', 'HOLES', 'HOLLY', 'HOMES', 'HONEY', 'HONOR', 'HOOKS', 'HOOPS', 'HOPES',
                    'HORSE', 'HOUND', 'HOUSE', 'HOVER', 'HUMAN', 'HUMOR', 'HURRY', 'HURTS', 'IDEAL', 'IDEAS',
                    'IDIOM', 'IMAGE', 'IMPLY', 'INDEX', 'INFER', 'INNER', 'INPUT', 'INTRO', 'IRATE', 'IRONY',
                    'CRANE', 'TOILS', 'SOILS', 'ROILS', 'COILS', 'BOILS', 'FOILS'];
            }
            newGame();
        }

        function newGame() {
            targetWord = validWords[Math.floor(Math.random() * validWords.length)];
            guesses = [];
            gameOver = false;
            document.getElementById('message').textContent = '';
            document.getElementById('guessInput').value = '';
            renderBoard();
        }

        function submitGuess() {
            if (gameOver || guesses.length >= 6) return;

            let guess = document.getElementById('guessInput').value.toUpperCase();
            if (guess.length !== 5) {
                document.getElementById('message').textContent = 'Must be 5 letters.';
                return;
            }

            if (!validWords.includes(guess)) {
                document.getElementById('message').textContent = 'Invalid word.';
                return;
            }

            guesses.push(guess);
            document.getElementById('guessInput').value = '';

            if (guess === targetWord) {
                document.getElementById('message').textContent = '🎉 You Won.';
                document.getElementById('message').className = 'message win';
                gameOver = true;
            } else if (guesses.length >= 6) {
                document.getElementById('message').textContent = `Game Over. The word was ${targetWord}.`;
                document.getElementById('message').className = 'message lose';
                gameOver = true;
            }

            renderBoard();
        }

        function renderBoard() {
            let html = '';
            for (let i = 0; i < 6; i++) {
                html += '<div class="guess-row">';
                const guess = guesses[i];
                const feedback = guess ? getLetterFeedback(guess, targetWord) : [];
                for (let j = 0; j < 5; j++) {
                    let letter = guess?.[j] || '';
                    let className = 'guess-tile';
                    if (letter) {
                        className += ' ' + (feedback[j] || 'absent');
                    }
                    html += `<div class="${className}">${letter}</div>`;
                }
                html += '</div>';
            }
            document.getElementById('guesses').innerHTML = html;
        }
        
        function getLetterFeedback(guess, target) {
            const result = new Array(guess.length);
            const targetCounts = {};
            
            // Count available letters in target
            for (let char of target) {
                targetCounts[char] = (targetCounts[char] || 0) + 1;
            }
            
            // First pass: mark correct positions
            for (let i = 0; i < guess.length; i++) {
                if (guess[i] === target[i]) {
                    result[i] = 'correct';
                    targetCounts[guess[i]]--;
                }
            }
            
            // Second pass: mark present/absent
            for (let i = 0; i < guess.length; i++) {
                if (result[i] === undefined) {
                    if (targetCounts[guess[i]] > 0) {
                        result[i] = 'present';
                        targetCounts[guess[i]]--;
                    } else {
                        result[i] = 'absent';
                    }
                }
            }
            
            return result;
        }

        document.getElementById('guessInput').addEventListener('keypress', e => {
            if (e.key === 'Enter') submitGuess();
        });

        loadWords();
    </script>
<div id="footer-container"></div>
    <script>
        fetch('/partials/navbar.html').then(r => r.text()).then(html => {
            document.getElementById('navbar-container').innerHTML = html;
        });
        fetch('/partials/footer.html').then(r => r.text()).then(html => {
            document.getElementById('footer-container').innerHTML = html;
        });
    </script>
</body>
</html>
