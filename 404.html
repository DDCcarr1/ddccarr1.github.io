<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DDCcarr1 | 404</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            text-align: center;
            color: white;
        }

        .error-code {
            font-size: 8em;
            font-weight: bold;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        .error-message {
            font-size: 2em;
            margin-bottom: 20px;
            opacity: 0.95;
        }

        .error-description {
            font-size: 1.1em;
            margin-bottom: 40px;
            opacity: 0.8;
            max-width: 500px;
            margin-left: auto;
            margin-right: auto;
        }

        .buttons {
            display: flex;
            gap: 20px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn {
            padding: 12px 30px;
            font-size: 1em;
            border: 2px solid white;
            background: transparent;
            color: white;
            border-radius: 8px;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.3s ease;
            font-weight: bold;
        }

        .btn:hover {
            background: white;
            color: #667eea;
            transform: translateY(-2px);
        }

        .btn-primary {
            background: white;
            color: #667eea;
            border-color: white;
        }

        .btn-primary:hover {
            background: rgba(255, 255, 255, 0.9);
            color: #764ba2;
        }

        .emoji {
            font-size: 4em;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="emoji">😕</div>
        <div class="error-code">404</div>
        <div class="error-message">Page Not Found</div>
        <div class="error-description">
            Oops! The page you're looking for doesn't exist. It might have been moved or deleted.
        </div>
        <div class="buttons">
            <a href="/" class="btn btn-primary">Go Home</a>
            <a href="/directory.html" class="btn">Browse Directory</a>
        </div>
    </div>
</body>
</html>
